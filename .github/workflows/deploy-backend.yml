name: Deploy Backend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

env:
  PROJECT_ID: anime-taste-dna
  PROJECT_NUMBER: "197238956100"
  REGION: northamerica-northeast2
  REPOSITORY: anime-taste-dna
  SERVICE: anime-taste-dna-api
  MODEL_BUCKET: anime-taste-dna-models-197238956100
  MODEL_OBJECT: signed-rating-hybrid-v2/signed_rating_hybrid.npz
  RUNTIME_SERVICE_ACCOUNT: anime-taste-dna-runtime@anime-taste-dna.iam.gserviceaccount.com
  FRONTEND_ORIGIN: https://anime-taste-dna.vercel.app

jobs:
  deploy:
    name: Cloud Run
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Select source revision
        id: source
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: echo "sha=${WORKFLOW_RUN_SHA:-$DISPATCH_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: >-
            projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@anime-taste-dna.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Restore production model artifact
        run: |
          mkdir -p data/artifacts/signed-rating-hybrid-v2
          gcloud storage cp \
            "gs://${MODEL_BUCKET}/${MODEL_OBJECT}" \
            data/artifacts/signed-rating-hybrid-v2/signed_rating_hybrid.npz

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push verified backend image
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/backend"
          docker buildx build \
            --platform linux/amd64 \
            --file backend/Dockerfile \
            --tag "${image}:${SOURCE_SHA}" \
            --tag "${image}:latest" \
            --push \
            .
          echo "IMAGE=${image}:${SOURCE_SHA}" >> "$GITHUB_ENV"

      - name: Deploy immutable image to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --min-instances 0 \
            --max-instances 1 \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 20 \
            --timeout 60 \
            --port 8080 \
            --update-env-vars "ALLOWED_ORIGINS=${FRONTEND_ORIGIN}" \
            --quiet

      - name: Smoke test deployed revision
        run: |
          service_url="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          curl --fail --show-error --silent \
            --retry 5 --retry-delay 2 --retry-all-errors \
            "${service_url}/health"
