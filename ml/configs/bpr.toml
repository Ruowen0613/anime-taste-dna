[paths]
split_directory = "../data/processed/v1/splits"
output_report = "reports/bpr-pairwise-fold-in-v1.json"

[training]
embedding_dimension = 32
epochs = 1
batch_size = 131072
learning_rate = 0.01
weight_decay = 0.0001
positive_rating_threshold = 8
seed = 42
device = "auto"

[validation]
checkpoint_users = 2048
fold_in_regularization_candidates = [0.1, 1.0, 10.0, 100.0]
observed_ratings = 10
relevance_threshold = 8
ranking_k = 10
user_batch_size = 128
parquet_batch_size = 131072
pairwise_fold_in_steps = 8
