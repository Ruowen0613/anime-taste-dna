[paths]
split_directory = "../data/processed/v2-user-holdout"
artifact_path = "../data/artifacts/weighted-als-hybrid-v1/weighted_als_hybrid.npz"
output_report = "reports/rating-scale-validation-v1.json"

[fixed_model]
signed_regularization = 100.0
signed_weight = 0.05

[selection]
popularity_decay_exponents = [0.0, 0.5, 1.0]
popularity_decay_pivot = 10
maximum_mean_ndcg_loss_fraction = 0.03
maximum_mean_recall_loss_fraction = 0.03

[evaluation]
observed_ratings = [5, 10, 20, 40, 80]
relevance_threshold = 8
ranking_k = 10
user_batch_size = 128
parquet_batch_size = 131072
seed = 42
