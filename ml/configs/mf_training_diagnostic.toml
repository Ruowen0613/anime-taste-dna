[paths]
base_config_path = "configs/matrix_factorization.toml"
output_report = "reports/mf-training-diagnostic-v1.json"

[evaluation]
regularization_candidates = [10.0, 100.0, 1000.0]
observed_ratings = [10]
relevance_threshold = 8
ranking_k = 10
user_batch_size = 128
parquet_batch_size = 131072
pair_samples = 10000
seed = 42

[[variants]]
name = "lower-learning-rate"
learning_rate = 0.005
weight_decay = 0.00001
epochs = 12
early_stopping_patience = 3

[[variants]]
name = "moderate-weight-decay"
learning_rate = 0.005
weight_decay = 0.0001
epochs = 12
early_stopping_patience = 3

[[variants]]
name = "strong-weight-decay"
learning_rate = 0.005
weight_decay = 0.001
epochs = 12
early_stopping_patience = 3
