[paths]
split_directory = "../data/processed/v2-user-holdout"
artifact_path = "../data/artifacts/weighted-als-hybrid-v1/weighted_als_hybrid.npz"
output_report = "reports/signed-hybrid-test-v1.json"

[fixed_selection]
signed_regularization = 100.0
signed_weight = 0.05

[behavior_gates]
max_counterfactual_top_10_overlap = 0.7
max_popularity_top_10_overlap = 0.7
minimum_catalog_coverage_fraction = 0.01

[evaluation]
observed_ratings = [5, 10, 20]
relevance_threshold = 8
ranking_k = 10
user_batch_size = 128
parquet_batch_size = 131072
seed = 42
