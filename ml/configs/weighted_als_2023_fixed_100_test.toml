[paths]
split_directory = "../data/processed/v4-user-holdout-fixed-100"
processed_directory = "../data/processed/v1"
output_report = "reports/weighted-als-2023-fixed-100-test-v1.json"
artifact_path = "../data/artifacts/weighted-als-2023-fixed-100-v1/weighted_als_hybrid.npz"

[training]
dimensions = 16
alpha = 10.0
regularization = 1.0
