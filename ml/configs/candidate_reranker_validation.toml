[paths]
split_directory = "../data/processed/v2-user-holdout"
artifact_path = "../data/artifacts/weighted-als-hybrid-v1/weighted_als_hybrid.npz"
output_report = "reports/candidate-reranker-validation-v1.json"

[fixed_model]
signed_regularization = 100.0
signed_weight = 0.05
popularity_decay_exponent = 1.0
popularity_decay_pivot = 10

[model]
candidates = 200
hidden_units = 16
residual_weight_candidates = [0.0, 0.001, 0.003, 0.01, 0.03, 0.05, 0.1, 0.2, 0.3, 0.5]

[training]
users = 3000
pseudo_target_count = 20
negatives_per_positive = 10
epochs = 8
batch_size = 2048
learning_rate = 0.001
weight_decay = 0.0001
seed = 42

[evaluation]
observed_ratings = [10, 20, 40, 80]
relevance_threshold = 8
ranking_k = 10
user_batch_size = 128
parquet_batch_size = 131072
